notes: "出典で確認したのは、熊本弁の「むしゃんよか」が「かっこいい」の意味で、主に外見や見栄えがよいことを指し、「むしゃんええ」ともいうこと、小学生が「あんスポーツカーはむしゃんよかねー」などと言う例が書かれていること。熊本県内の地域差と、周辺県の分布は未確認。数値は作成時の見積もり。"
