notes: "出典で確認したのは、群馬弁でものもらいを「めっぱ」(高崎、渋川、富岡、西毛地域)、「めかご」(吾妻、沼田、藤岡地域)、「めかいご」(中毛、桐生、太田地域)、「めけご」(館林地区)と呼ぶという地域注記。渋川は「めっぱ」、藤岡は「めかご」とあるが西毛との重なりがあるため両方を混ぜた値にした。中毛を前橋・伊勢崎セルに当てたのは作成者の解釈。埼玉・栃木など隣県での呼び名は未確認。数値は作成時の見積もり。"
