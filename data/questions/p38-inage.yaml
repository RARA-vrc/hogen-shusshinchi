notes: "出典(伊予弁)で確認したのは「いなげ」な=おかしな、変わった、変な、風変わりな。ほかに Wikipedia「広島弁」(https://ja.wikipedia.org/wiki/広島弁)に「いなげな」(県北・西部)、Wikipedia「山口弁」(https://ja.wikipedia.org/wiki/山口弁)に「いなげな」=変な・怪しげな があり(いずれも2026-11-19閲覧)、広島西部・県北と山口にも値を置いた。広島東部・中部の値と四国他県の分布は未確認。数値は作成時の見積もり。"
