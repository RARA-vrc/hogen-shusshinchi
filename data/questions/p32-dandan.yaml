notes: "出典で確認したのは、雲伯方言の語彙に「だんだん」=ありがとう があり、家族の間では使わないとされる点。雲伯方言は島根県出雲地方(飯南町を除く)・隠岐と鳥取県西部(米子市・境港市・西伯郡・日野郡)で話されるとある。セル3201-3203・3207・3103に当てた(セル境界と方言域は一致しない)。石見・鳥取東中部の値と、県外のmedia値は根拠のない見積もり。周辺県の分布は未確認。"
