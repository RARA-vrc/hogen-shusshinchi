notes: "出典で確認したのは、薩隅方言の語彙に「〜ジャッセン?:〜だよね。〜じゃない?」があり、主に県北西部の川内地方で用いられると書かれていること。川内は川薩セル(4605)に当てた。隣の出水(4606)と鹿児島市(4601)で聞く程度、鹿児島県のほかの地域、周辺県での使用は未確認。数値は作成時の見積もり。"
