notes: "出典で確認したのは、阿波弁の語彙に「まがる」=邪魔になる があること。あわせて Wikipedia「伊予弁」(https://ja.wikipedia.org/wiki/伊予弁 、2026-11-19閲覧)に「まがる」=触る(「まがるなや」=さわるなよ)があるため、愛媛の値を置いた。どちらも県内の地域差、香川・高知など周辺県の分布は未確認。例文は作成者の作文。数値は作成時の見積もり。"
