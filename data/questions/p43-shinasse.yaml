notes: "出典で確認したのは、熊本弁の「〜しなっせ」が「〜しなさい。〜してみなさい」の意味で、「ぬっかうち、早よ食べなっせ」(温かいうちに早く食べなさい)の例があること。熊本県内の地域差、年代差、周辺県の分布は未確認。数値は作成時の見積もり。"
