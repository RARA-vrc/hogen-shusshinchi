notes: "出典で確認したのは、飛騨弁の「だちかん(だしかん)」が「駄目だ」の意味で「埒が明かぬ」から転じたもの、丁寧形は「だちきません」とされる点。美濃・富山など周辺地域での使用、世代差は未確認(美濃の値は推定)。数値は作成時の見積もり。"
