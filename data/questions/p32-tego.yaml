notes: "出典(雲伯方言)の語彙に「てご」=手伝い がある。範囲は雲伯方言域(島根県出雲・隠岐、鳥取県西部)として扱った。Wikipedia「岡山弁」(https://ja.wikipedia.org/wiki/岡山弁 、2026-11-19閲覧)の語彙に「てごーする」=手伝う があるため、岡山県にも中程度の値を置いた。例文は作成者の作文。石見・広島など他の周辺地域の分布は未確認。数値は作成時の見積もり。"
