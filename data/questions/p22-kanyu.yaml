notes: "出典で確認したのは、静岡県の勧誘表現が東部(富士川以東)「べー」、中部(富士川以西・掛川市以東)「ざあ」(行かざあ)、西部(袋井市・森町以西)「まい(か)」(行かまい(か)・行きまい(か))に分かれること、「やらざぁ」は山梨・長野でも使われるとされること(静岡弁)、勧誘形が尾張「行こまい」・三河「行かまい」で対立すること(三河弁)、湖西市の文法は東三河弁とほぼ同じとされること(遠州弁)。中東遠セルは中部と西部の境界をまたぐため混合値にした。知多の値、若い世代での使用率、山梨・長野の値は未確認の推定。「べ」は別の質問(g09-be)で扱うため選択肢を「ほか」にまとめた。数値は作成時の見積もり。"
