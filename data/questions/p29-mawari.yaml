notes: "出典の語彙の節で確認したのは、「まわり」を「準備」の意味で用いること(例は「準備したかい?」にあたる文)。県内の地域差・世代差の記載はなく、他県で使うかも記載なし。周辺県(京都南部・大阪・三重など)の分布は未確認。数値は作成時の見積もり。"
