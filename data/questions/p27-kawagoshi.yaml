notes: "出典で確認したのは、泉南では「皮ごと食べる」のような「ごと」にあたる接尾語に「ごし」を使い、大阪市などでは「ぐち」とすること。「大阪市など」の範囲(大阪府内他地域・兵庫・京都・奈良など)は未確認のため府内他地域は中間値、府外はdefault。泉南は泉州セル(2707)の一部。若い世代でどれだけ使うかも未確認。数値は作成時の見積もり。"
