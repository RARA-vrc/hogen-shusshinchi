notes: "出典で確認したのは、岩手県南部の旧仙台藩域で話される岩手県南部方言ではトンボを「あげず」と言い、県中北部では「だんぶり」と言う、という語彙の違いが挙がっている点。南部方言地域は金ケ崎町から大船渡市まで(岩手県の記事)なので胆江・両磐・気仙セルに当てた。釜石セルの扱いは作成者の判断。年配の語の可能性があるため設問は「年配の人が呼んでいた名前」とした(世代差は未確認)。秋田・青森・宮城での呼び名は未確認で、周辺県にも出る可能性があるのでdefaultにも少し値を置いた。数値はすべて作成時の見積もり。"
