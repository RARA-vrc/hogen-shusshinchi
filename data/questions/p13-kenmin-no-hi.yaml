notes: "出典で確認したのは、首都圏では茨城県・群馬県・埼玉県・千葉県・東京都・山梨県で都県民の日に公立学校などが休日になること、日付が千葉6月15日・東京10月1日・群馬10月28日・茨城11月13日・埼玉11月14日・山梨11月20日であること、栃木県民の日(6月15日)は休校にならず給食でデザートが出る日であること、神奈川県には県民の日がないこと。選択肢が5つまでのため茨城(11月13日)と埼玉(11月14日)は1つの選択肢にまとめ、山梨(11月20日、休校あり)は「ほかの日」に含まれる(山梨は既定値のまま)。愛知(学校ホリデーで日を選ぶ方式)・香川(2026年度から県立学校のみ休校)は既定値のまま。私立校や制定前の世代は休みでなかった可能性があり、数値は作成時の見積もり。"
