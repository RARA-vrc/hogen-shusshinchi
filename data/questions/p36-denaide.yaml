notes: "出典で確認したのは、阿波弁で「〜でないで」が「〜ではないか」を表し、「あるでないで」(あるじゃないか)の例がある点。県内の地域差、周辺県の分布は未確認。例文の「なんな」は作成者の作文。数値は作成時の見積もり。"
