notes: "出典で確認したのは、南部弁で推量に「降るごった」(降るだろう)のように「ごった」を使う場合があり、これは南部弁特有で秋田弁(鹿角地方以外)・津軽弁など隣接方言では使われない、という点。南部弁の地域は、青森県東半分(下北・上北・三戸郡)、岩手県北部から中部の旧南部藩域、秋田県鹿角地方とされる。岩手県の記事の方言区分では南部方言地域が金ケ崎町から大船渡市までで、南部弁の地域外(旧仙台藩域)なので低めにした。セルへの割り当て(大館・鹿角セルは鹿角を含むので中くらい、花巻・釜石も中くらい)は作成者の解釈。若い世代での使用度は未確認。数値はすべて作成時の見積もり。"
