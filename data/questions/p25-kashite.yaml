notes: "出典で確認したのは、湖北・湖東・湖南にかけて「一緒に……してほしい」という意味の「-て+かし(て)」があり、「行ってかして」「来てかし」のように使うこと。出典の「湖南」が大津市を含むかは未確認のため大津(2501)と東近江(2504)は中間値にした。若い世代での使用度、周辺県の分布は未確認。数値は作成時の見積もり。"
