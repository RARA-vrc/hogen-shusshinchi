notes: "出典で確認したのは、薩隅方言の語彙に「ダカラヨ:そうだ」があり、「ジャッド/ジャライ」より若い人が使い、同年代にしか使わないと書かれていること。沖縄のウチナーヤマトグチにも「だからよ」「だからよー」が相づち・了解の言葉として載っているため、沖縄も高めにした。共通語の「だからさ」と形が近く、他地域でも同じ形の相づちを使う人がいる可能性があるので default をやや高めにした。奄美(4612)、諸県(4502・4505)、熊本・宮崎のほかの地域での使用は未確認。数値は作成時の見積もり。"
