notes: "出典で確認したのは、相づちの「ほや」(「そうや」から)を「ほやほや」「ほやほやほや」と2〜3回重ねて言うことが多いのが福井弁の特徴だという点。出典は嶺北の方言が対象で、嶺南の値は推定。「ほや」単独は他の地域でも使われうるが、周辺県の分布は未確認。数値は作成時の見積もり。"
