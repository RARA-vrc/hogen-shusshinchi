notes: "出典で確認したのは、栃木弁の「だいじ?」(「だいじけぇ?」など)が「大丈夫?」の意味で、県外からの転入者が最初にぶつかる言葉の壁と言われるほど県内でメジャーだという点。茨城弁の記事には記載がなく、茨城・群馬など周辺県の分布は未確認(既定値のまま)。数値は作成時の見積もり。"
