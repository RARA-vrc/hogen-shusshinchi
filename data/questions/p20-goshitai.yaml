notes: "出典で確認したのは、「ごしてえ」が北信・東信・中信で「とても疲れた」の意味で使われ、北信北部・諏訪・上伊那を中心に点々と分布するとの記述。セルへの割り当て(特に諏訪・上伊那・木曽・飯伊)は作成者の解釈。世代差、群馬・新潟など周辺県の分布は未確認。数値は作成時の見積もり。"
