notes: "出典で確認したのは、但馬弁で「〜てば」にあたる言い方として主に北部で「〜ちゃ」を用い、促音・撥音に付くこと(例「それでええっちゃ」「行かれんちゃ」)。但馬南部の使用度は低い可能性があるが、但馬は1セル(2808)のため一括。鳥取・丹後など周辺の分布は未確認(他地方にも似た「ちゃ」がある可能性があり、defaultをやや高めにした)。数値は作成時の見積もり。"
