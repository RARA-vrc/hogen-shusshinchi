notes: "出典で確認したのは、サンマーメンが神奈川県横浜市発祥のご当地ラーメンで、横浜市周辺から関東の他都県にも広がったこと、県内でも小田急小田原線沿線より北側や西湘地域ではあまり食べられていないこと。西湘を平塚・小田原周辺セル、小田急線より北を相模原セルに当てたのは作成者の大まかな解釈。数値は作成時の見積もり。"
