notes: "出典で確認したのは、終助詞「-ねや」が「〜よ」「〜ね」にあたり、村山地方・最上地方で使うという点。庄内・置賜での使用は出典に記載がなく、県内のほかの地域は「聞いたことがある」程度と見積もった。周辺県の分布は未確認。例文のさくらんぼは場面づくりのための作成者の創作。数値はすべて作成時の見積もり。"
