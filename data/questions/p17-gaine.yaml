notes: "出典で確認したのは、金沢弁で「がいや」「がいね」を付けて強調し「言っているじゃないか」の意味になること(「いや」は男性、「いね」は女性に多い)。南加賀・能登での使用、世代差、富山・福井など周辺県の分布は未確認。数値は作成時の見積もり。"
