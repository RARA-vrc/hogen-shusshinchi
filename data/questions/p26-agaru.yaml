notes: "出典で確認したのは、京都市中心部など格子状の街路の地域で、北へ向かうことを「上ル」、南へを「下ル」、東西を「東入」「西入」と表すこと、公的な住所では通り名を使わない市内周縁部でもこの方法で所在地を表すことが一般的であること。京都市外の府内・滋賀・大阪での使用は出典に記載がなく、値は作成者の見積もり(聞いたことがある程度を想定)。"
