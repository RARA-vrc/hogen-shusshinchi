id: p20-shinai
category: grammar
fun: 0.8
text: "友達が雑貨を手に取って「これ、かわいいしない?」、さらに「週末、映画に行くしない?」。「〜じゃない?」「〜しない?」の意味で言い切りの形に付けるこの「〜しない?」、あなたは――"
