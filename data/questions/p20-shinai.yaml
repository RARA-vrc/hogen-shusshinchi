notes: "出典で確認したのは、長野地域の新方言として、動詞・形容詞の終止形に「しない?」を付けて勧誘・推量・同意を求めること(例「これってかわいいしない?」「映画に行くしない?」)、1940年ころ須坂市で生まれ1970年ころ長野市など県北部に広がったとされること(異説あり)、若い人がよく使うこと。北信以外の県内セルの値と周辺県(新潟・群馬)の分布は未確認の推定。数値は作成時の見積もり。"
