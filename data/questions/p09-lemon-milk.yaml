notes: "出典で確認したのは、レモン牛乳が栃木県内の製乳メーカー2社が作る乳飲料の通称で、主に宇都宮市内の店や学校の購買・運動会などで売られて宇都宮市民になじみ深いこと、県外でも一部で買えること。県内の他地域・隣県での普及度は未確認。数値は作成時の見積もり。"
