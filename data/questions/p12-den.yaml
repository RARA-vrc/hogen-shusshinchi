notes: "出典で確認したのは、房州弁の文末「〜でん」が「〜じゃん」「〜でしょ」にあたること(例「こらぁ、ひでーでん」)、房州弁が安房地域を中心に上総南部(勝浦市・大多喜町・御宿町・いすみ市・富津市・君津市など)で日常的に話され、袖ケ浦市・市原市の一部にも似た方言があること。「でん」個別の地域範囲、若年層での使用は未確認(記事は廃れた言葉も多いとする)。セルへの当てはめと数値は作成時の見積もり。"
