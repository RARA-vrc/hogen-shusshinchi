notes: "出典で確認したのは、北海道方言の動詞「ばくる」が「交換する」の意味で、交換し合うことを「ばくりっこする」と言う点。道内の地域差・世代差は出典に記載なし。青森など周辺地域での使用は未確認。数値はすべて作成時の見積もり。"
