notes: "出典で確認したのは、紀州弁の結果態に「降っちゃーる」「降ったーる」など多くの形があり、和歌山市・海草郡・那賀郡では「降っちゃーる」、日高郡以南では「降ったーる」が多いこと。三重県南牟婁では「降ったる・降ったーる・降っちゃーる」、北牟婁では「降っとる」を使うとある(2404は南北牟婁を含むので低め)。泉州弁の記事には泉州で「てある」が変化した「ちゃある」を使うとある。橋本・有田(3003・3004)は出典に記載がなく中間値。数値は作成時の見積もり。"
