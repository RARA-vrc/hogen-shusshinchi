notes: "出典で確認したのは、熊本弁の「ぐらしか」(気の毒だ)が南部のうち球磨・葦北地域で使われ、薩隅方言と重複すること、薩隅方言の語彙に「グラシカ:可哀そうだ、気の毒だ」があること。球磨・葦北の範囲は出典に明記されているので medium とした(葦北は芦北セル4309に当てた)。薩隅方言の記事は鹿児島県(奄美群島を除く)と宮崎県諸県地方を範囲としているため、鹿児島本土を高め、奄美(4612)を低め、諸県(4502・4505)を中程度にしたが、それぞれの地域での実際の使用は未確認。八代・天草など熊本県のほかの地域は未確認で低め。数値は作成時の見積もり。"
