notes: "出典で確認したのは、佐賀弁で方向を表すのに「さん」「さい」「さみゃー」が広く用いられること(例「学校さん行く」)、熊本弁の「〜さん(=へ)」(例「どこさん行く」「福岡さん行ってきた」)、長崎弁の方向の助詞 san/shan/same。佐賀・長崎・熊本で使う点は出典どおりだが、使用頻度の差(佐賀を最も高くした点)は作成時の見積もり。福岡県・鹿児島県など他県の分布は未確認。数値は作成時の見積もり。"
