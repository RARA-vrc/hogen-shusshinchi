notes: "出典で確認したのは、東三河では「のん」が使われ「のんほい」は豊橋で特に有名なこと、「のんほい」は西三河では全く使われないとされること。東三河北部(新城周辺)・尾張・遠州の値は未確認の推定。県内の他地域で「見聞きした」人の割合も推定で未確認。数値は作成時の見積もり。"
