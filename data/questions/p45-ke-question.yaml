notes: "出典で確認したのは、日向方言の疑問の終助詞「〜け」が標準語の「〜か」に相当するがよりやわらかく、他者への問いかけにだけ使い、主に県北で使われること。県北を延岡西臼杵(4503)と日向入郷(4507)に当てたのは作成時の判断。疑問の「〜け」は他地方(例えば東日本の一部)にもある可能性があり、大分県など周辺県の分布も未確認のため、default をやや高めにした。薩隅方言の記事にも疑問を表す接尾語「ケ」の例(「ジャッタケ」)があるが、鹿児島での使用度は未確認で default のまま。数値は作成時の見積もり。"
