notes: "出典で確認したのは次の点。山形県の村山・最上地方は牛肉・里芋・こんにゃく・ねぎをしょうゆで味付け(置賜も牛肉で、豆腐が入り味噌を少し加える)。庄内地方は豚肉などを入れたみそ味が一般的。宮城県の仙台平野は豚肉・里芋を仙台味噌で味付け。福島県中通りは豚肉しょうゆ味、浜通りは豚肉みそ味が一般的で、会津を中心に味噌と醤油のブレンドが見られる。岩手県(北上盆地など)は鶏肉しょうゆの「とりすき風」芋の子汁が一般的。秋田県は豚肉みそ味のなべっこも作られるが、きりたんぽやだまこもちが中心。芋煮会は宮城・山形・福島を中心に新潟・関東にも例がある。置賜を「牛肉・しょうゆ」に、会津をみそ・しょうゆ半々に振ったのは作成者の判断。宮城県の仙台平野以外、岩手の北上盆地以外、どれだけの人が行事に参加するかは未確認。数値はすべて作成時の見積もり。"
