notes: "出典で確認したのは、薩隅方言の語彙に「ダイヤメ:晩酌」があり、「だれやめ」が訛ったもの(疲れ=ダレを止める)と説明されていること。薩隅方言の記事は鹿児島県(奄美群島を除く)と宮崎県諸県地方を範囲としているため、鹿児島本土を高め、奄美(4612)を低め、諸県(4502・4505)を中程度にしたが、語ごとの分布は記事に書かれておらず未確認。熊本県南部など他県の分布も未確認。数値は作成時の見積もり。"
