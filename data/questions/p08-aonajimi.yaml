notes: "出典で確認したのは、茨城弁の語彙として「あおなじみ」=青あざがあり、主に土浦以東の地域で使われるという点。土浦以東を土浦・鹿行のセルに当てたのは作成者の解釈(水戸・県北などがどこまで含まれるかは未確認)。栃木・千葉など周辺県の分布は未確認。数値は作成時の見積もり。"
