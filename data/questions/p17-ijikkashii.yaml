notes: "出典で確認したのは、金沢弁の「いじっかしい」が「しつこい」「うっとうしい」の意味で使用範囲が広く、若い世代の言い方とされる点、富山弁では対応する語が「いじくらしい」とされる点。県全体(能登・南加賀)での使用は未確認で県単位の推定。富山の値は似た語からの推定。数値は作成時の見積もり。"
