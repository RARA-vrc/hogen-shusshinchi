notes: "出典で確認したのは、伊賀では強い断定で「わして」と言い、「だよ」にあたる表現に「やして」があること。出典に例文はなく、問題文の文は作成者が組み立てたもの(要確認)。伊賀はセル2402(中勢伊賀)の一部にすぎないため値を低めにした。他県での使用は記載なし(泉州弁の記事には泉南の「わして」が紀州と共通するとあるが、「やして」とは別)。周辺県の分布は未確認。数値は作成時の見積もり。"
