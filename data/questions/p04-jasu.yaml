notes: "出典で確認したのは、「ジャス」がジャージのことで、昭和30年代に仙台市北部近辺を起源とする説が有力とされ、一方で元はラグビー用語で千葉や茨城など関東から南東北の海岸沿いに広く流布していたとも書かれている点。宮城県内のどこまで使われるかは未確認で、宮城県全体に当てたのは作成者の判断。岩手・福島・茨城・千葉の値は出典の「関東から南東北の海岸沿い」をもとにした弱い見積もりで、岩手は出典に名前がない。数値はすべて作成時の見積もり。"
