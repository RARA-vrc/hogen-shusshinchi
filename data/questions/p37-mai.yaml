notes: "出典で確認したのは、讃岐弁で「まい」が「〜しなさい/〜してみてください」の意味で使われ、「食べまい」の例がある点。伊予弁の「〜まい」(付加疑問)は別用法。県内の地域差、周辺県の分布は未確認。例文の前半は作成者の作文。数値は作成時の見積もり。"
