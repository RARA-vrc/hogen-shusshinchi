notes: "出典で確認したのは、北海道方言の動詞に「ちょす、ちょうす(いじる、いじくる)」があり、浜言葉(沿岸部)の語彙にも「ちょす(触る)」が挙がっている点。道内の地域差、青森など周辺地域での使用は未確認。数値はすべて作成時の見積もり。"
