notes: "出典で確認したのは、子ども時代を群馬県で過ごした人は読み札をほぼ暗記していることが多いこと、2月の県競技大会に向けて県内の子どもが冬休みなどに練習すること、競技では最初に「つる舞う形の群馬県」を2回読むこと。子ども会の大会は減っているとの記述もあり、若い世代の値は不確か。隣県での知名度は未確認。数値は作成時の見積もり。"
