notes: "出典で確認したのは、阿波弁では女性が全県的に「じゃ/だ/や」の代わりに「じょ」という女性言葉を用いるという点。男性回答者は「聞く」側に寄るとみてuseを低めにした。周辺県の分布は未確認。山梨の禁止の「〜ちょ」(g16-cho)とは別の表現。例文は作成者の作文。数値は作成時の見積もり。"
