notes: "出典で確認したのは、ゼリーフライが埼玉県行田市付近に広まったご当地グルメで、おからとゆでたジャガイモを主原料にした素揚げの惣菜、小判形から「銭富来」が訛った名だとされること。行田市は県北部セル(熊谷周辺)に含めた。県内の他地域や群馬側での知名度は未確認。数値は作成時の見積もり。"
