notes: "出典で確認したのは、秋田県では校外の河原などで開く「なべっこ遠足」が定着しており、小中高校の学校行事になっている場合もあること、ただし小学校201校のうち現在も実施しているのは15校(7.5%)のみと書かれている点。実施校は減っているため、経験や見聞の割合は世代で差があるはず(未確認)。県内では秋田市・由利本荘市・能代市など沿岸で「なべっこ」と呼ばれるとの記述もある。周辺県の分布は未確認。数値はすべて作成時の見積もり。"
