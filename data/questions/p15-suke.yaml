notes: "出典で確認したのは、新潟弁で理由の「から」に当たる語尾が「終止形+スケ」で、若年層では「終止形+ッケ」の形が多い点。出典の「新潟弁」は新潟市を中心とする地域の方言に限るとしているため、新潟市周辺以外のセルの値は未確認の推定。同源とされる関西の「さかい」とは別扱い。周辺県の分布は未確認。数値はすべて作成時の見積もり。"
