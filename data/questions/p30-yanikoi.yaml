notes: "出典の紀中・紀南方言の語の一覧で確認したのは、「やにこい」=「とっても」で、日高郡みなべ町・田辺市・白浜町を中心とした西牟婁地方の語とされていること。田辺セル(3006)を中心に、みなべ町を含むと思われる御坊セル(3005)を中間にした(セルの範囲との対応は未確認)。問題文の文全体は作成者が組み立てたもので、出典に例文はない。周辺県の分布は未確認。数値は作成時の見積もり。"
