notes: "出典で確認したのは、茨城弁で「け」が「〜かい」にあたり、相づちで「そうなの」の意味の「そっけ」がよく使われるという点。栃木弁の記事にも疑問の語尾「け」(例「そうけぇ?」)、房州弁の記事にも「そうけ」=「そうか」がある。相づちとしての使用頻度が栃木・房州でどの程度かは未確認で、栃木・安房の値は作成者の見積もり。数値はすべて作成時の見積もり。"
