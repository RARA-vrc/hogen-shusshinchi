notes: "出典で確認したのは、仙台弁の「おだつ・おだづ」が「調子に乗る、いきがる」の意味で、「おだづな」と否定形で使われることが多いという点。仙台以外の宮城県内での使用、周辺県(岩手・山形・福島など)の分布は未確認。数値はすべて作成時の見積もり。"
