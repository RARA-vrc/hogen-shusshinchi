notes: "出典で確認したのは次の点。博多弁では文末の「と」で疑問文を作る(「知っとーと?」の例)。北九州弁は疑問文で「と」でなく「ん」を使い、博多弁の「食べると?」に対し「食べるん?」と言う(北九州弁の範囲は遠賀郡〜京築地域とされる)。熊本弁にも「食べんと?」の例がある。日向方言(宮崎)の疑問の「〜と?」は県全域で使われる。長崎弁では「と」が準体助詞として使われる(疑問の例「こいだいんと?」)。佐賀県・鹿児島県・大分県の疑問の「と」は未確認のため、佐賀は肥筑方言の一員として福岡・長崎・熊本と同じ値に置いたが根拠は弱い。北九州以外の西日本の「〜ん?」の分布(default の n の値)は出典未確認の見積もり。直方・鞍手(4010)は北九州弁の範囲かどうか未確認で中間値。数値はすべて作成時の見積もり。"
