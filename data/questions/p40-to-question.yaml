source: "Wikipedia日本語版「博多弁」https://ja.wikipedia.org/wiki/博多弁 /「北九州弁」https://ja.wikipedia.org/wiki/北九州弁 /「熊本弁」https://ja.wikipedia.org/wiki/熊本弁 /「日向方言」https://ja.wikipedia.org/wiki/日向方言 / 英語版「Nagasaki dialect」https://en.wikipedia.org/wiki/Nagasaki_dialect (2026-11-19閲覧。二次情報であり、一次文献は未確認)"
