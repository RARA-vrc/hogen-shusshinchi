notes: "出典で確認したのは、静岡弁の「とぶ、とんでく」が「走る、走っていく」の意味で、静岡県全域で使われる語の印(★)が付いていること、神奈川県西部地区でも通用するとされること。神奈川は西部のみの記述だが県単位で薄めた値にした。愛知・山梨・長野など他の周辺県は未確認。世代差も未確認。数値は作成時の見積もり。"
