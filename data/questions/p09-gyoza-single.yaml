notes: "出典で確認したのは、宇都宮市と周辺地域で餃子1人前(1枚)を「しんぐる」、2人前を「だぶる」、3人前を「とりぷる」と言うという点。宇都宮以外の県内・県外の分布は未確認で、宇都宮周辺以外の栃木の値は作成者の見積もり。数値は作成時の見積もり。"
