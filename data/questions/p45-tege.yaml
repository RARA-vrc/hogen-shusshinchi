notes: "出典で確認したのは、日向方言(宮崎弁)の「てげ」が「とても」の意味で、「てげふてかったっちゃが」(ものすごく大きかったんだよ)の例があること。似た語として鹿児島の薩隅方言の「テゲ/テゲテゲ」は「大概」(いい加減、ほどほど)の意味で載っており、「とても」の意味ではないため鹿児島は低めにした(ただし「聞いたことがある」と答える人はいる想定)。諸県地方(4502・4505)は薩隅方言系とされるので宮崎県のほかより低めにしたが、実際の使用は未確認。大分・熊本の分布は未確認。数値は作成時の見積もり。"
