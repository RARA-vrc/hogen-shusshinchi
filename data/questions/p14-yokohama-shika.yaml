notes: "出典で確認したのは、横浜市歌は他自治体の歌と比べ市民への浸透度が高いとされ、横浜市立の小・中学校では1990年代から音楽の授業で校歌とともに歌唱指導が行われ、市立学校出身者の多くが歌えると言われること。一方で教育を受けていない人や転入者は知らないこともあるとの指摘もある。横浜市外の県内での知名度は未確認。数値は作成時の見積もり。"
