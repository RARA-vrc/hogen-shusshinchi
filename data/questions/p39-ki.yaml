notes: "出典で確認したのは、土佐弁で「から」「ので」にあたる順接の接続助詞に「きに」「きん」「き」「け(ー)」「けん」を使うという点。どの地域でどれを使うかは記載なし(幡多など県内差は未確認)。讃岐弁の記事には西讃・中讃の「きん」があるが、「き」「きに」とは形が違うため香川には値を置かなかった。周辺県の分布は未確認。例文は作成者の作文。数値は作成時の見積もり。"
