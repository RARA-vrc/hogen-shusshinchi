notes: "出典で確認したのは、古語の伝達の助動詞「げな」が熊本県北部(および福岡県南部)で現在も使われていること(例「明日ん練習休みげな」)、筑後弁で伝聞に「げな」が使われること、長崎弁でも伝聞に gena が挙がっていること。「熊本県北部」が熊本市を含むかは書かれていないため、荒尾・玉名(4303)・山鹿(4304)・菊池(4305)を高め、熊本市・宇城・阿蘇を中程度にしたのは作成時の判断。福岡県南部は筑後のセル(4006-4008)に当てた。佐賀県、熊本県南部、福岡県のほかの地域は未確認で低めの値。若い世代の使用度も未確認。数値は作成時の見積もり。"
