notes: "出典で確認したのは、秋田弁の語彙表に「ガッコ」(漬け物、香の物。「香々」からか)が載っている点。県内の地域差、岩手・青森・山形など周辺県での使用は出典に記載がなく未確認。「いぶりがっこ」などの商品名で県外の人も聞いたことがあり得るため、defaultのhearを高めにした。数値はすべて作成時の見積もり。"
