notes: "出典で確認したのは、岩手県中北部では主に女性が親しみをこめて言う場合に「なはん」を用いる(南部弁の記事)、盛岡弁の例として「あのなはん」(あのね)「しばれるなはん」(冷えますね)がある(盛岡弁の記事)という点。主に女性の言い方とされるため、useは低め、hearを高めにした。「中北部」をどのセルに当てるかは岩手県の記事の方言区分(北部・沿岸・中部=盛岡〜北上市北部、南部=金ケ崎〜大船渡)からの作成者の解釈。青森南部など周辺県の分布は未確認。数値はすべて作成時の見積もり。"
