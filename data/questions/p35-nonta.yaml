notes: "出典で確認したのは、「のんた」が周防方言の代表的な間投助詞(周防方言を「のんた弁」とも呼ぶ)で、下関・豊浦方言には見られないという点。周防をセル3501-3504、下関を3506に当て、その他の長門側は中間値にした(旧国境とセル境界の対応は作成者の判断で未確認)。世代差は出典に記載なし。数値は作成時の見積もり。"
