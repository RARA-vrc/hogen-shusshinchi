notes: "出典で確認したのは、泉南では過去形を作るとき「た」に直接「ねん」を付け(「行ったねん」)、大阪市内では「てん」に変える(「行ってん」)こと。泉南は泉州セル(2707)の一部なので値は控えめ。堺・南河内は出典に記載なく低めの見積もり。和歌山など府外の分布は未確認。数値は作成時の見積もり。"
