notes: "出典で確認したのは、文末に「(なん)やさ」を付けるのが飛騨弁の特徴とされ、男性は「(なん)やうぇ」と付けることも多いという点。美濃や富山・長野など周辺地域での使用は未確認で、美濃の値は「聞いたことはある」程度の推定。世代差も未確認。数値は作成時の見積もり。"
