notes: "出典で確認したのは、美濃弁で1981年生まれ以降の世代に終助詞に「お」を添える傾向があり、2012年の美濃地方出身の19〜23歳への調査で友人との会話で「やお/やよ」を使う人が90%に上ったとされる点。名古屋弁の記事には「やお」の記載がなかったが、愛知など周辺県で使われないことを確認したわけではない。飛騨と年配層の値は推定。例文は作成者の文。数値は作成時の見積もり。"
