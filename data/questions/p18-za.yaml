notes: "出典で確認したのは、福井弁(嶺北の方言)で相手への主張を強める終助詞「ざ」があり、「ほんなことしたらあかんざ」の例がある点。出典は嶺北(敦賀を除く旧越前)を対象とし、嶺南は別扱いのため嶺南セルは推定。若者は共通語化が進んでいるとの記述あり。石川・富山など周辺県の分布は未確認。数値は作成時の見積もり。"
