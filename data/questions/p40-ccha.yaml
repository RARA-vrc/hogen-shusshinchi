notes: "出典で確認したのは、北九州弁の「-ちゃ/っちゃ」が「-だよ」の意味で、同意のあいづちとして「そうっちゃ」「そうなんちゃ!」と使われること。北九州弁の範囲は遠賀郡〜京築地域とされ、北九州市西部(八幡以西)では同じ意味で「-ばい」になるとも書かれている(セル単位では区別できないので4012全体を高めにした)。大分弁にも文末を強める「〜っちゃ」(例「違うっちゃ!」)があり、日向方言でも「と」の後の断定が「っちゃ」になる(「見たっちゃが」)ため、大分・宮崎にも値を置いた。筑豊(4009-4011)、山口県、福岡市以西で聞くかどうかは未確認。数値は作成時の見積もり。"
