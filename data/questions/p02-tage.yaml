notes: "出典で確認したのは、津軽弁で「すごい、たくさん」の意の語として青森「わや」、弘前「たげ」、五所川原「がっぱ」が並べて挙がり、「わや」(とても)は青森市周辺で主に使われ、弘前周辺ではほとんど「たげ」が使われる、という点。各市を津軽地域・青森地域・西北五地域セル全体に広げたのは作成者の解釈。ほかの地方(北海道など)で「わや」が別の意味で使われる可能性は未確認で、値は未調整。南部地方の値も見積もり。数値はすべて作成時の見積もり。"
