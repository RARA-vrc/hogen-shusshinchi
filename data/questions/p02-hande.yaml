notes: "出典で確認したのは、津軽弁では理由の「から」に「降るはんで」のように「はんで」を使い、南部弁の「すけ」と対立する(津軽弁の記事)、青森県南部地方では主に「すけ/しけ」、下北では「すて/して」、三戸郡では「へんで」を使い、岩手県は主に「から」だが北部に「はんて」「へで」「すけえ」もある(南部弁の記事)という点。青森市セルを津軽側に入れたのは、津軽弁の記事が青森市周辺の語(わや)も津軽弁として扱っているための作成者の判断。「へんで」(三戸郡)は「はんで」と形が近いが、出典の区分に従い南部側の選択肢にまとめた。新潟・北陸・近畿などの「さけ・さかい」系はこの選択肢では拾えず、それらの地域の値は未調整(defaultのsukeを少し上げただけ)。秋田県北部の分布は未確認。数値はすべて作成時の見積もり。"
