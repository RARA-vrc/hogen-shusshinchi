notes: "出典で確認したのは、三河弁で動詞の連用形に「りん」を付けて軽い命令を作り、名古屋弁の「食べやあ」に対して三河弁は「食べりん」となること、名古屋弁の記事で知多半島では軽い命令「〜りん」を用いるとされること。尾張の「聞いたことがある」の値、遠州など静岡県・岐阜県での使用、世代差は未確認の推定。例文は作成者の文。数値は作成時の見積もり。"
