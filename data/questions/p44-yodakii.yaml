notes: "出典で確認したのは次の点。大分弁の「よだきい」は面倒・疲れたなどの気持ちを表し、県全体で多くの世代が使い、宮崎弁でも使われる。日向方言の記事では「よだきい」は宮崎県の県民気質を表すことばとしてよく使われる有名な宮崎弁で、熊本県阿蘇地方、大分県、福岡県の豊前・築上地域でも使われるとされる。薩隅方言の記事には「ヨダキ:(諸県?)疲れた、面倒くさい」とあり、諸県での使用は記事自体が疑問符つき。範囲が出典に明記されているので medium。阿蘇(4306)と京築(4013、豊前・築上)は中程度、諸県(4502・4505)は宮崎県の値よりやや低めにしたのは作成時の判断。北九州市など福岡県のほかの地域や鹿児島県本土は未確認。数値は作成時の見積もり。"
