notes: "出典の語彙一覧で確認したのは、「ごーがわく」(業が沸く)が「業を煮やす。腹が立つ」の意味で、使用地域が湖北・湖東・湖南と書かれていること。他県での使用は出典に記載がなく、周辺県の分布は未確認(他府県にも似た言い方がある可能性あり)。表記は出典の「ごーがわく」を「ごうがわく」と書いた。数値は作成時の見積もり。"
