notes: "出典で確認したのは、紀北方言の例として「つれもて」=「一緒に」、「いこら」=「行きましょう」が挙げられ、「つれもて飲もら」(一緒に飲もう)の例もあること。紀北を和歌山・那賀・橋本(3001〜3003)に対応させたが、紀中・紀南での使用は出典で未確認のため県内他地域は中間値。周辺県の分布は未確認。数値は作成時の見積もり。"
