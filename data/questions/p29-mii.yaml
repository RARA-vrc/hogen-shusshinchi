notes: "出典で確認したのは、北和・中和地方で間投助詞「み(ー)」を盛んに用い、回想的な内容を表すこと。北和・中和を奈良市・東和・西和・中和(2901〜2904)に対応させ、南和(2905)は低めにした(セル境界との対応は概略)。他県での使用は出典に記載がなく、周辺県の分布は未確認。世代差も未確認。数値は作成時の見積もり。"
