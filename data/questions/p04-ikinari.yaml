notes: "出典で確認したのは、仙台弁の「いきなり・いぎなり・いきなし」に「突然」のほか「とても、超」の意味があり、例として「イキナリうめぇ」(とてもおいしい)が挙がっている点。仙台以外の宮城県内での使用と周辺県の分布は未確認。数値はすべて作成時の見積もり。"
