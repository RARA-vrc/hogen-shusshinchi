notes: "出典で確認したのは次の点。仮定条件に、佐賀地区(旧佐賀藩域)では「ぎー・ぎ・ぎにゃー」(例「あめん ふっぎー よかない」)、田代地区では「ぎり・ぎりー」、唐津地区では「なら・なりゃー」を使う。長崎県では佐世保市を中心に「ぎー・ぎ・ぎん・ぎんた」、大村・彼杵方言東部に「ぎんにゃ」、諫早に「ぎっと」、島原半島北部に「ぎら・ぎらー」、南部に「ぎりゃ・ぎりゃー」がある。地域は出典に明記されているので medium としたが、セルへの割り当て(佐賀地区=4101・4104・4105、田代を含む東部4102は変種「ぎり」で中程度、唐津4103は低め、県央4203・島原4204は変種があるので中程度)は作成時の判断。長崎市(4201)、五島・壱岐・対馬、福岡・熊本での使用は未確認。若い世代の使用度も未確認。数値は作成時の見積もり。"
