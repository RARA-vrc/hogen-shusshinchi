notes: "出典で確認したのは、勧誘表現に伊勢では「に」を付け(伊賀は「さ」、志摩は「に」や「か」)、伊勢弁の例として「一緒に行こに=行こうよ」があること。伊勢弁は三重県北中部の旧伊勢国の方言とされる。2402は中勢と伊賀を含むため少し低め、東紀州(2404)は出典に記載なく低めにした。他県での使用は記載なし、周辺県の分布は未確認。数値は作成時の見積もり。"
