notes: "出典で確認したのは、念押し・強調・断定の終助詞「〜っちゃ」が山口県から北九州市・大分県・宮崎県にかけて頻用され、仙台弁でも多用されるという点。北九州はセル4012に当てた。宮城は県全体に中程度の値を置いたが範囲は未確認。福岡県の他地域など周辺の分布は未確認。数値は作成時の見積もり。"
