notes: "出典で確認したのは、金沢弁の「まっし」が優しい命令を表し(「頑張るまっし」「行きまっし」など)、小松市などでも使われ、若い世代にも比較的残っている(ただし励まし・勧誘の意味に変わりつつある)という点。能登での使用、富山など周辺県の分布は未確認で、能登・富山の値は推定。全国でもテレビ等で聞いた人がいる想定。数値は作成時の見積もり。"
