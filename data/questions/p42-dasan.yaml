notes: "出典で確認したのは、能力の否定(〜できない)を表す -ださん が長崎市の方言だけで使われるという記述と、「…行きださんじゃった」の例文(町へ行こうと思っていたが忙しくて行けなかった、の意)。出典が長崎市に限ると明記しているので confidence は medium。若い世代がどの程度使うかは未確認で、県内のほかの地域で聞く程度も見積もり。英語版の記事であり日本語版「長崎弁」には該当記述が見当たらなかった。数値は作成時の見積もり。"
