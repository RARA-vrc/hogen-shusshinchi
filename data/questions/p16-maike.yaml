id: p16-maike
category: grammar
fun: 0.6
text: "週末の予定を話していたら、友達が「じゃあ、いっしょに行こまいけ」。「一緒に行こう」と誘うこの「〜まいけ」(「〜んまいけ」とも)、あなたは――"
