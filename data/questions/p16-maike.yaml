notes: "出典で確認したのは、富山弁で勧誘(〜しよう)に「まいけ」を使い、呉西では「〜まいけ」、呉東では「〜んまいけ」となる点、用例「行こまいけ」。県内ほぼ全域で使われるとの記述による。愛知・遠州の「〜まい」とは形が違うが、「け」の付かない形との混同で県外の値がやや上がる可能性あり。石川など周辺県の分布は未確認。数値は作成時の見積もり。"
