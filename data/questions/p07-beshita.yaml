notes: "出典で確認したのは、「言ったじゃないですか」の言い方として、ゆったべした(相馬市・福島市・会津若松市付近)、ゆったばい(郡山市付近)、ゆったっぱい(白河市付近)、ゆったっぺよ(いわき市付近)が挙げられている点。各市付近を県北・相双・会津、県中、県南、いわきの各セル全体に広げたのは作成者の解釈で、境界は未確認。「〜っぺよ」は北関東など県外の「〜っぺ」と似ているため県外にも少し値を置いたが、県外の分布は未確認。数値はすべて作成時の見積もり。"
