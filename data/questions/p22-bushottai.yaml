notes: "出典で確認したのは、静岡弁の「ぶしょったい、ぶしょってぁ」が「汚らしい、だらしない」の意味で、静岡県全域で使われる語の印(★)が付いていること、遠州弁の記事にも「ぶしょったい」(だらしない、汚い、格好悪い)があること。世代差、愛知・山梨・神奈川など周辺県の分布は未確認。数値は作成時の見積もり。"
