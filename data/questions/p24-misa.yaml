notes: "出典で確認したのは、連用形に「さ」を付ける柔らかい命令(「書きさ」「みーさ」)を伊賀・伊勢で使うこと、伊賀では勧誘にも「さ」を付けること。伊勢弁の記事にも連用形に「さ」「な」「ない」を付ける穏やかな命令の記述がある。東紀州(2404)は記載がないため低め。他県での使用は記載なし、周辺県の分布は未確認。数値は作成時の見積もり。"
