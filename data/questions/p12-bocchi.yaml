notes: "出典で確認したのは、「ぼっち」がラッカセイを干す野積みの千葉県での呼称だという点(千葉弁記事の関連項目)。落花生の産地が県内のどこか、都市部での知名度、茨城など他県での呼び名は未確認。数値は作成時の見積もり。"
