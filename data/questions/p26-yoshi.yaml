notes: "出典で確認したのは、京言葉で女性層が連用形に「よし」を付ける軽い命令表現を使い、例として「はよ行きよし」があり、大正末期に川東から広まったとされること。現在の使用状況、京都市外・他府県(滋賀など)での使用は出典に記載がなく未確認。男性はあまり使わない可能性がある(未確認)。数値は作成時の見積もり。"
