notes: "出典で確認したのは、京都市中心部の通り名を覚えるために通り名を織り込んだ歌が使われ、東西の通りの歌として「丸竹夷」、南北の通りの歌として「寺御幸」がよく知られていること。歌詞は引用していない。「北から順に」は作成者の補足で要確認。どの程度の人が知っているか、府外での知名度は出典に記載がなく、数値は作成時の見積もり。"
