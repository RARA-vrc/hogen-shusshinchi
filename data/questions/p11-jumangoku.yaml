notes: "出典で確認したのは、十万石ふくさやがテレ玉(テレビ埼玉)を中心にCMを流していること、キャッチフレーズが「うまい、うますぎる」(棟方志功の考案)であること。県民の認知度の記述はなく、値は作成者の見積もり。テレ玉が県外でどこまで映るかは未確認で、隣接都県の値も見積もり。"
