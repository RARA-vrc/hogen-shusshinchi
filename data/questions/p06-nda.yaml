notes: "出典で確認したのは、「そうだ」を意味する各方言として、村山弁「んだず」「んだべした」「んだずにゃー」、新庄弁「んだじゅー」「んだにゃー」、置賜弁「んだっそ」「んだごで」、庄内弁「んだのー」が挙げられている点。新庄弁を最上地方セル全体に当てたのは作成者の解釈。「んだべした」は福島でも使われるため選択肢から外した。山形県外の分布は未確認。数値はすべて作成時の見積もり。"
