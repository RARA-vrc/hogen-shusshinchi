notes: "出典で確認したのは、日向方言の終助詞「じ」が「〜が」と同じような目的で使われ、「〜が」が語尾を下げるのに対し「〜じ」は語尾を上げて使い、主に県央で使われること(例「明日晴れやじ」=明日晴れだよ)。県央を宮崎東諸県(4501)と西都児湯(4506)に当てたのは作成時の判断(記事の区分では中部=児湯・宮崎北部)。周辺県の分布は未確認。数値は作成時の見積もり。"
