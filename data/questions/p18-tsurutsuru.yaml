notes: "出典で確認したのは、「つるつるいっぱい」がコップなどに液体があふれる寸前まで注がれた様子を指し、北陸で広く使われ方言と知らずに使われていることが多い点(福井弁の記事)、富山弁の記事でも石川・福井で使われるとされる点。嶺南(福井弁の記事の対象外)と新潟など周辺県の値は推定で未確認。北陸3県を区別する力は弱く、北陸と他地域を分ける質問。数値は作成時の見積もり。"
