notes: "出典で確認したのは、「…だに」(「…だよ」の意)が長野県方言の南信州地域・上伊那南部地域の項にあること、三河弁の記事で「だに」は東三河のみで使われるとされること、遠州弁の記事で「〜だに」(断定)が挙げられていること。上伊那は南部のみの記載のため値を下げた。諏訪・木曽・西三河の値は「聞いたことがある」程度の推定で未確認。遠州弁の地域内分布、世代差も未確認。数値は作成時の見積もり。"
