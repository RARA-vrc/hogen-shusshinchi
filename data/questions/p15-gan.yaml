notes: "出典で確認したのは、新潟弁で「もの・こと・の」に当たる形式名詞として「ガン」が使われ、「ワカラネガンガ」の例がある点。問題文の例文は作成者が出典の例をもとに作った。出典は新潟市中心の方言が対象で、県内他地域・世代差・周辺県(北陸の準体助詞「が」との関係を含む)は未確認。数値は作成時の見積もり。"
