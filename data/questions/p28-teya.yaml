notes: "出典で確認したのは、播州弁に動詞の連用形+「て」によるテヤ敬語があり(例「○○さん、今休んどってや」)、「はる」を使う大阪・京都と対比されていること、過去形「-た(あ)った」は播州広域、「-ちゃった」は播州北部とされること。神戸・但馬・丹波・淡路や他府県での使用は出典で未確認のため値は見積もり。"
