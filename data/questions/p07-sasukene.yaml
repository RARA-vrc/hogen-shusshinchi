notes: "出典で確認したのは、語彙一覧に「さすけーねー(さすけねぇ)→差し支えない、問題ない」があり、地域表示が(北・中)=県北(福島市・伊達・二本松・本宮など)と県中(郡山市・田村など)である点。県南・会津・浜通りでの使用は出典に記載がなく、県内のほかの地域の値は見積もり。周辺県の分布は未確認。数値はすべて作成時の見積もり。"
