notes: "出典で確認したのは、ウチナーヤマトグチの語彙に「シニカン」があり、「シニ」(とても。非常に)と同義で、おもに沖縄本島北部で使われると書かれていること。本島北部を北部セル(4701)に当てた。本島中南部・宮古・八重山でどの程度聞くかは未確認で、宮古・八重山を本島中南部より低めにしたのは作成時の判断。数値は作成時の見積もり。"
