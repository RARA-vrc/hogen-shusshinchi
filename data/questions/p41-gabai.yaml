notes: "出典で確認したのは、「がばい」が程度を表す副詞で「とても」「すごく」にあたり、『佐賀のがばいばあちゃん』で全国的に知られるようになった佐賀弁の単語であること、また佐賀県では古くは「こー」「くぅー」が使われていたこと。全国的に知られているため県外の media を高めにした。佐賀県内で日常的にどの程度使われるか、長崎・福岡など周辺県で使うかは未確認。数値は作成時の見積もり。"
