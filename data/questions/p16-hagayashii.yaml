notes: "出典で確認したのは、富山弁の「はがやしい」が「はがゆい」「うっとうしい」のような意味で、思い通りにならないときに使うこと、金沢弁では「はんげー」となること。石川の値は、似た語があるため聞いて意味がわかる人がいる想定の推定。県内の地域差・世代差、岐阜など他の周辺県は未確認。数値は作成時の見積もり。"
