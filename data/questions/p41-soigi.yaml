notes: "出典で確認したのは、佐賀弁の語彙として「そいぎ(んた)」が「それじゃあ。そしたら。それでは。」「さようなら。それならば。」の意味で載っていること。佐賀県内の地域差(唐津地区・田代地区で使うか)と、長崎・福岡など周辺県の分布は未確認。数値は作成時の見積もり。"
