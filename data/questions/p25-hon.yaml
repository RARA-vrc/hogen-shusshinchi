notes: "出典で確認したのは、終助詞「ほん」が柔らかな念押し・主張・意志の強調を表し、確証や自信を伴う表現であること、彦根を中心に湖東から湖北・旧マキノ町にかけて用いられること。セル対応は彦根周辺(2505)・湖北(2506)を中心とし、東近江(2504)と高島(2507、旧マキノ町のみ該当)は一部該当として低めにした。他県での使用は出典に記載がなく、周辺県の分布は未確認。年代差も未確認。数値は作成時の見積もり。"
