    - "こんにちは。いくつか質問に答えてもらえれば、あなたの出身地を当ててみせます。"
  next:
    - "では、次の質問です。"
    - "なるほど。続けますね。"
    - "ふむふむ。次はこちら。"
  hunch:
    - "少しずつ見えてきました。"
    - "だいぶ絞れてきましたよ。"
  result_cell:
    - "わかりました。あなたは{pref}の{label}あたりの出身ですね?"
  result_pref:
    - "わかりました。あなたは{pref}の出身ですね?"
  result_region:
    - "県までは絞りきれませんでしたが、{region}地方の出身ではありませんか?"
  retry:
    - "おや、違いましたか。では、{place}ではどうでしょう?"
  hit:
    - "やりました。当たりですね。"
  miss:
    - "参りました。降参です。"
  ask_answer:
    - "よければ、正解を教えてください。今後の参考にします。"
  thanks:
    - "ありがとうございました。また遊んでくださいね。"
