# Single source of truth for licence and credit information.
# scripts/build-licenses.ts generates both LICENSES.md and the in-app credits
# data (src/generated/credits.json) from this file. Do not edit LICENSES.md by
# hand.
#
# Rules (see README):
# - Add a third-party dataset only after opening its distribution page and
#   confirming licence, credit wording and retrieval date. Never fill these in
#   from memory.
# - Non-commercial licences (CC BY-NC etc.) are not allowed here.
# - npm packages are not listed here; they are read from package.json and
#   node_modules at build time.
#
# Fields: id, category (code | own-data | third-party-data), name, source_url,
# license, license_url, credit, processing, retrieved (YYYY-MM-DD).
# For this project's own work, source_url is "self" and retrieved is "n/a".

entries:
  - id: source-code
    category: code
    name: 本プロジェクトのソースコード
    source_url: self
    license: MIT
    license_url: https://opensource.org/license/mit
    credit: © 2026 RARA
    processing: 自作
    retrieved: n/a

  - id: question-data
    category: own-data
    name: 自作の質問データ・進行役の台詞データ(data/questions/、data/host/)
    source_url: self
    license: CC BY 4.0(暫定)
    license_url: https://creativecommons.org/licenses/by/4.0/deed.ja
    credit: © 2026 RARA
    processing: 自作(質問文・選択肢・分布定義・台詞はすべて本プロジェクトで作成)
    retrieved: n/a

  # Checked on the distribution page on 2026-11-19: the page for the FY2020
  # edition (product specification v2.0) states "オープンデータ(CC_BY_4.0)".
  # The older FY2014 edition (A38-14) is marked "非商用" and must NOT be used.
  - id: ksj-a38-2020
    category: third-party-data
    name: 国土数値情報 医療圏データ(2020年度(令和2年度)版、A38-20)
    source_url: https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A38-v2_0.html
    license: CC BY 4.0(配布ページの表示は「オープンデータ(CC_BY_4.0)」)
    license_url: https://nlftp.mlit.go.jp/ksj/other/agreement.html
    credit: 出典:国土交通省国土数値情報ダウンロードサイト(https://nlftp.mlit.go.jp/ksj/gml/datalist/KsjTmplt-A38-v2_0.html)。「国土数値情報(医療圏データ)」(国土交通省)をもとに RARA 作成
    processing: 一次医療圏(市区町村)ポリゴンを二次医療圏・都道府県ごとに統合し、形状を簡略化して小さな島を省略、TopoJSON に変換。市区町村と二次医療圏の対応表、二次医療圏の名称・代表点を抽出
    retrieved: "2026-11-19"

  # Checked on 2026-11-19: e-Stat terms of use (based on the Government of
  # Japan Standard Terms of Use v2.0, compatible with CC BY 4.0, commercial
  # use allowed).
  - id: census-2020
    category: third-party-data
    name: 令和2年国勢調査 都道府県・市区町村別の主な結果(総務省統計局)
    source_url: https://www.e-stat.go.jp/stat-search/files?toukei=00200521&tstat=000001049104&tclass1=000001049105&stat_infid=000032143614
    license: 政府統計の総合窓口(e-Stat)利用規約(政府標準利用規約 第2.0版準拠、CC BY 4.0 互換)
    license_url: https://www.e-stat.go.jp/terms-of-use
    credit: 出典:政府統計の総合窓口(e-Stat)(https://www.e-stat.go.jp/)。「令和2年国勢調査 都道府県・市区町村別の主な結果」(総務省統計局)を加工して作成
    processing: 市区町村別の総人口と名称を抽出し、二次医療圏ごとに人口を合計。人口で重み付けした代表点の計算に使用
    retrieved: "2026-11-19"
